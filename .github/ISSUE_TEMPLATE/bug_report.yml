name: Bug report
description: Something in tiabwft doesn't work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste API keys, tokens, `.env` values or private memory facts.
        For a security problem, use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Prompt: "..."
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Stack suggestion (the 💡 block)
        - Side panel
        - Memory (memory.md, remember/forget, background reader)
        - Azure sync
        - Session tips (model, context, cost, limits)
        - Commands (/tiabwft ...)
        - Install or update
        - Other
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: tiabwft version
      description: From `.claude-plugin/plugin.json` or `/plugin`.
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Suggestion mode
      options:
        - always
        - big-asks-only
        - "off"
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: The suggestion block, an error, or test output. Remove anything private.
      render: text
