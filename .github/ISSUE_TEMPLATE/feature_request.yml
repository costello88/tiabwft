name: Feature request
description: Suggest an improvement, a better pick for a reference file, or a new idea.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How should tiabwft behave? An example prompt and the answer you'd want helps a lot.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Stack suggestion (the 💡 block)
        - Reference files (catalog, community, models and costs, ...)
        - Side panel
        - Memory
        - Session tips
        - Commands
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: sources
    attributes:
      label: Links
      description: For a new tool or repo to recommend, a link to it (it must exist, be maintained and have readable source).
