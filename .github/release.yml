# Categories for auto-generated release notes (gh release create --generate-notes).
# A PR lands in the first category whose labels it has.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Docs
      labels:
        - docs
        - documentation
    - title: Other
      labels:
        - '*'
